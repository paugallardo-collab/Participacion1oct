# Reglas recomendadas de análisis estático para aplicaciones Flutter.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # Se conservan las reglas recomendadas, sin desactivar avisos.
  rules:
    # avoid_print: false  # Ejemplo desactivado; la regla sigue vigente.
    # prefer_single_quotes: true  # Ejemplo de regla opcional.
